schema_version: 1

context:
  name: de-dwd
  version: 1.0.1

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/de-dwd-${{ version }}.tar.gz
  sha256: 5abe835da14ff7d08e049327c3c3801d1ca6148e443a7e5b73991f12ea898e7e

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - poetry
  run:
    - python >=${{ python_min }}
    - python-dateutil
    - urllib3 >=1.25.3

tests:
  - python:
      imports:
        - deutschland.dwd
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: "Deutscher Wetterdienst: API"
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/bundesAPI/dwd-api

extra:
  recipe-maintainers:
    - jan-janssen
